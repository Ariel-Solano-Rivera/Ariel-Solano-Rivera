<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1180" height="980" viewBox="0 0 1180 980" role="img" aria-labelledby="title desc">
  <title id="title">Perfil profesional de Ariel Solano Rivera</title>
  <desc id="desc">Panel futurista tipo terminal con retrato ASCII, perfil, tecnologías y contactos.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111c"/>
      <stop offset="0.58" stop-color="#102538"/>
      <stop offset="1" stop-color="#07111c"/>
    </linearGradient>
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </linearGradient>
    <pattern id="microgrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#173248" stroke-width="1" opacity="0.42"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="terminalClip"><rect x="42" y="42" width="1096" height="896" rx="24"/></clipPath>
  </defs>
  <style>
    text { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
    .frame { fill: #0d1b2a; stroke: #23445b; stroke-width: 1.5; }
    .terminalBar { fill: #091722; }
    .titlebar { fill: #83a5bb; font-size: 12px; letter-spacing: 1.2px; }
    .kicker { fill: #22d3ee; font-size: 13px; font-weight: 700; letter-spacing: 2.6px; }
    .name { fill: #e6f6ff; font-size: 42px; font-weight: 800; letter-spacing: -1.4px; }
    .role { fill: #83a5bb; font-size: 17px; font-weight: 600; }
    .prompt { fill: #22d3ee; font-size: 14px; font-weight: 700; }
    .status { fill: #e6f6ff; font-size: 15px; }
    .metaLabel { fill: #83a5bb; font-size: 11px; font-weight: 700; letter-spacing: 1.5px; }
    .metaValue { fill: #e6f6ff; font-size: 14px; font-weight: 600; }
    .ascii { fill: #bcecff; font-size: 13.5px; font-weight: 600; white-space: pre; }
    .asciiAccent { fill: #22d3ee; font-size: 11px; font-weight: 700; letter-spacing: 2px; }
    .eyebrow { fill: #22d3ee; font-size: 11px; font-weight: 700; letter-spacing: 1.6px; }
    .sectionTitle { fill: #e6f6ff; font-size: 20px; font-weight: 800; letter-spacing: .5px; }
    .focus { fill: #e6f6ff; font-size: 14px; font-weight: 600; }
    .subpanel { fill: #102538; stroke: #23445b; stroke-width: 1; }
    .hairline { fill: none; stroke: #23445b; stroke-width: 1; }
    .pill { fill: #0d1b2a; stroke: #23445b; stroke-width: 1; }
    .pillText { fill: #e6f6ff; font-size: 11.5px; font-weight: 600; }
    .contactBg { fill: #102538; stroke: #23445b; stroke-width: 1; transition: fill .2s ease; }
    .contactLabel { fill: #22d3ee; font-size: 10px; font-weight: 700; letter-spacing: 1.4px; }
    .contactValue { fill: #e6f6ff; font-size: 12.5px; font-weight: 600; }
    .contact:hover .contactBg { fill: #091722; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .scan { animation: scan 7s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; transform-origin: 437px 432px; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes scan { from { transform: translateY(-40px); } to { transform: translateY(930px); } }
    @keyframes pulse { 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .scan, .pulse { animation: none !important; }
      .scan { display: none; }
    }
  </style>

